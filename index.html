<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1421">
  <title>Álbum Copa 2026 do JL ⚽</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
</head>
<body>
  <header class="topbar">
    <h1>⚽ Álbum Copa 2026 do JL</h1>
    <div class="progress-strip" id="statStrip"></div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="mainBar" style="width:0%"></div></div>
  </header>

  <main id="main"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="album"><span class="ico">📖</span>Álbum</button>
    <button data-tab="resumo"><span class="ico">🌎</span>Países</button>
    <button data-tab="faltam"><span class="ico">🔍</span>Faltam</button>
    <button data-tab="dicas"><span class="ico">💡</span>Dicas</button>
    <button data-tab="trocas"><span class="ico">🔁</span>Trocas</button>
    <button data-tab="jogos"><span class="ico">📅</span>Jogos</button>
    <button data-tab="dados"><span class="ico">💾</span>Dados</button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
