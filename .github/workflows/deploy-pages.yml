name: Publicar no GitHub Pages

# Publica o app na branch gh-pages, que o GitHub Pages serve automaticamente.
on:
  push:
    branches:
      - claude/figurinhas-album-tracker-dordfn
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Enviar para a branch gh-pages
        run: |
          rm -rf .github
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git add -A
          git commit -m "Publicar site (automático)"
          git push origin gh-pages-tmp:gh-pages --force
